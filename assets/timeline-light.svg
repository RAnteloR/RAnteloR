<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Training log: Formador, CFGS DAM, ITBid Technologies, Máster IA y Big Data, prácticas en NTT DATA 2027">
<defs>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e0313b" stop-opacity=".22"/><stop offset="1" stop-color="#e0313b" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
  .sans { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
  .grid line { stroke: #eef1f5; stroke-width: 1; }
  .prompt { fill: #57606a; font-size: 16px; }
  .acc { fill: #e0313b; }
  .axis { stroke: #d0d7de; stroke-width: 1.2; }
  .axis-t { fill: #57606a; font-size: 12px; }
  .drop { stroke: #d0d7de; stroke-width: 1.2; stroke-dasharray: 3 5; }
  .curve { stroke: #e0313b; stroke-width: 3.5; fill: none; stroke-linecap: round;
            stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 9s ease-in-out infinite; }
  .future { stroke: #e0313b; stroke-width: 3; fill: none; stroke-dasharray: 2 9; stroke-linecap: round;
             opacity: .7; animation: march 1.2s linear infinite; }
  .area { fill: url(#fade); animation: show 9s ease-in-out infinite; }
  .pt { stroke-width: 3; }
  .pt.done { fill: #ffffff; stroke: #1f2a44; animation: glow 4.5s ease-in-out infinite; }
  .pt.now { fill: #e0313b; stroke: #ffffff; }
  .pt.next { fill: #ffffff; stroke: #e0313b; stroke-dasharray: 4 3; }
  .ring { fill: none; stroke: #e0313b; stroke-width: 2; transform-box: fill-box; transform-origin: center;
           animation: ping 2s ease-out infinite; }
  .badge { fill: #e0313b; }
  .badge-t { fill: #ffffff; font-size: 12px; font-weight: 700; }
  .tag { fill: #57606a; font-size: 13px; letter-spacing: 1px; }
  .tag.acc { fill: #e0313b; }
  .title { fill: #1f2a44; font-size: 19px; font-weight: 700; }
  .meta { fill: #57606a; font-size: 14px; }
  @keyframes draw { 0% { stroke-dashoffset: 1; } 45%,100% { stroke-dashoffset: 0; } }
  @keyframes show { 0%,30% { opacity: 0; } 55%,100% { opacity: 1; } }
  @keyframes march { to { stroke-dashoffset: -11; } }
  @keyframes glow { 0%,100% { fill: #ffffff; } 15% { fill: #1f2a44; } 30% { fill: #ffffff; } }
  @keyframes ping { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .curve { stroke-dashoffset: 0; } }
</style>

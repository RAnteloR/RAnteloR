<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Raúl Antelo — IA, Big Data y Backend">
<style>
  .bg { fill: #ffffff; }
  .grid { stroke: #eef1f5; stroke-width: 1; }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
  .sans { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
  .prompt { fill: #57606a; font-size: 17px; }
  .name { fill: #1f2a44; font-size: 76px; font-weight: 800; letter-spacing: -2px; }
  .dot { fill: #e0313b; }
  .role { fill: #1f2a44; font-size: 24px; font-weight: 600; }
  .meta { fill: #57606a; font-size: 15px; }
  .acc { fill: #e0313b; }
  .track { fill: #f6f8fa; stroke: #d0d7de; }
  .bar { fill: #e0313b; animation: fill 7s ease-in-out infinite; transform-box: fill-box; transform-origin: left; }
  .cursor { fill: #e0313b; animation: blink 1s steps(1) infinite; }
  .edge { stroke: #d0d7de; stroke-width: 1.2; fill: none; }
  .pulse { stroke: #e0313b; stroke-width: 2; fill: none; stroke-dasharray: 14 400; stroke-dashoffset: 414;
            stroke-linecap: round; animation: flow 3s linear infinite; }
  .node { fill: #ffffff; stroke: #1f2a44; stroke-width: 2.5; animation: glow 3s ease-in-out infinite; }
  .node.out { stroke: #e0313b; stroke-width: 3; }
  @keyframes flow { to { stroke-dashoffset: 0; } }
  @keyframes glow { 0%,100% { fill: #ffffff; } 50% { fill: #e0313b; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes fill { 0% { transform: scaleX(0); } 80%,100% { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
